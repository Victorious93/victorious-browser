name: Delete merged branch

# Deletes a pull request's head branch once the PR is merged.
# Closed-but-unmerged PRs and PRs from forks are left alone.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Ignore "already gone" (404/422) so reruns and auto-delete don't fail the job.
          gh api -X DELETE "repos/${REPO}/git/refs/heads/${HEAD_REF}" || echo "Branch ${HEAD_REF} not deleted (already gone or protected)."
